services:
  - type: web
    name: magicpin-vera-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn magicpin_vera.bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_LLM
        value: "false"
