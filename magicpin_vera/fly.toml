# Fly.io deployment configuration for Magicpin Vera
app = "magicpin-vera-bot"
primary_region = "bom"  # Mumbai, India (closest to Magicpin judges)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  USE_LLM = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/v1/healthz"
